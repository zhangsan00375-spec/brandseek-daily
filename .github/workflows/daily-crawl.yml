name: BrandSeek Daily Crawl

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  crawl-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run crawler
        run: python crawler.py 2>&1 | tee crawl_log.txt
        continue-on-error: true
      - name: Send email
        env:
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python email_sender.py 2>&1 | tee email_log.txt
        continue-on-error: true
      - name: Upload all results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawl-results
          path: |
            crawl_result.json
            email_preview.html
            crawl_log.txt
            email_log.txt
          retention-days: 7
